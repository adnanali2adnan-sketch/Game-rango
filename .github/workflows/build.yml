name: Extract APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and copy APK
        run: |
          find . -name "*.apk" | head -10
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \;
          ls output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-rango-APK
          path: output/*.apk
